name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clients:
    name: Clients (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path extension/Cargo.toml --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  server:
    name: Server (PostgreSQL 19 in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server image
        run: docker compose build db
      - name: Extension tests
        run: docker compose --profile test run --rm --build extension-test
      - name: Integration tests
        run: scripts/test-integration.sh
      - name: Server logs
        if: failure()
        run: docker compose --profile test logs --no-color
