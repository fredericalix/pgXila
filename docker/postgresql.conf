# PostgreSQL configuration of the pgXila server image.
#
# pgXila clients are ordinary PostgreSQL clients: they use the standard wire
# protocol on the standard port. Encryption is mandatory.

listen_addresses = '*'

# The extension must be preloaded: it installs the connection guard that
# refuses unencrypted connections, and it registers the background workers.
shared_preload_libraries = 'pgxila'

# TLS 1.3 only. The certificate and key are generated on first start by the
# image entrypoint (development) or mounted by the operator.
ssl = on
ssl_cert_file = '/var/lib/pgxila/tls/server.crt'
ssl_key_file = '/var/lib/pgxila/tls/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# Authentication: SCRAM-SHA-256 with PostgreSQL roles.
password_encryption = 'scram-sha-256'
hba_file = '/etc/pgxila/pg_hba.conf'
