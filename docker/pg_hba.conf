# Client authentication for the pgXila server image.
#
# There is deliberately no "host" or "hostnossl" line: a TCP connection is
# only accepted over TLS. The pgxila extension enforces the same rule on its
# own, so loosening this file does not open unencrypted access.

# TYPE    DATABASE  USER      ADDRESS      METHOD

# Administration from inside the container, over the Unix socket.
local     all       postgres               peer

# Everything else: TLS and SCRAM-SHA-256.
hostssl   all       all       0.0.0.0/0    scram-sha-256
hostssl   all       all       ::/0         scram-sha-256
