# TEST ONLY. Never use this file to run a server.
#
# A deliberately loose configuration: it accepts unencrypted TCP connections.
# The integration tests start a throwaway server with it to prove that the
# pgxila extension refuses such connections even when pg_hba.conf allows them.

local   all   postgres            peer
host    all   all      0.0.0.0/0  scram-sha-256
host    all   all      ::/0       scram-sha-256
