[package]
name = "pgxila"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "pgXila: a fantasy OS that lives inside PostgreSQL"
license = "PostgreSQL"
repository = "https://github.com/fredericalix/pgXila"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg19"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = "=0.20.1"
serde_json = "1"
# Lua 5.4, built from the sources that come with the crate: the language of
# the scripts.
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# HTTPS, for the agent worker to call the model. No other part of the
# extension talks to the network.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# To keep signals away from the thread that makes that call.
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
pgrx-tests = "=0.20.1"

[profile.dev]
panic = "unwind"

[profile.dev.build-override]
opt-level = 3

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
